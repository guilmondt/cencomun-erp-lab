name: axelor-full-stack

on:
  push:
    branches: [lab/axelor-baseline]
    paths:
      - '.github/workflows/axelor-full-stack.yml'
      - 'labs/axelor/**'
      - 'versions.lock'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axelor-full-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout laboratory
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate workflow semantics
        run: bash labs/axelor/ci/check-workflow.sh
      - name: Issue 1 preflight before Task 020 validation
        run: |
          ./scripts/preflight.sh
          ./scripts/verify-repo.sh
      - name: Full-stack baseline on disposable external runner
        run: CCM_CI_RESULTS="$RUNNER_TEMP/ccm-axelor-results" bash labs/axelor/ci/run-host.sh
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axelor-full-stack-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ccm-axelor-results
          if-no-files-found: warn
          retention-days: 14
